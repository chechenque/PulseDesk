[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsedesk-rad"
version = "0.1.0"
description = "Centro de Control de Eventos en Tiempo Real"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Luis Angel Leyva Castillo"}
]
dependencies = [
    "PyQt6>=6.7",
    "qasync>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
pulsedesk = "pulsedesk.main:main"

[tool.setuptools.packages.find]
include = ["pulsedesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["qasync"]
ignore_missing_imports = true